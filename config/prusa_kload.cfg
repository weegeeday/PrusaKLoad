# PrusaKLoad Starter Configuration
# Include this file from your printer.cfg:
#   [include prusa_kload.cfg]
# And for physical Klipper LCD menus, also include:
#   [include prusa_kload_menu.cfg]

[prusa_kload]
# Attach to an existing [filament_switch_sensor <name>] or [filament_motion_sensor <name>].
# Alternatively, remove filament_sensor and set switch_pin: ^!PC15 (mutually exclusive).
filament_sensor: filament_switch_sensor fsensor
debounce_delay: 1.0

# Load / purge / unload kinematics
load_distance: 50.0
load_speed: 15.0
purge_distance: 30.0
purge_more_distance: 20.0
purge_speed: 4.0
unload_distance: 80.0
unload_speed: 20.0
ramming_distance: 10.0
ramming_speed: 15.0
cooling_moves: 1

# Thermal and timeout safety
cooldown_after_load: True
cooldown_after_unload: True
prompt_timeout: 300.0

# Optional toolhead parking during load/unload (stays in place by default)
# park_x: 10.0
# park_y: 10.0
# park_z: 30.0
# park_speed: 100.0
# auto_home_on_load: False

# Optional G-code hooks
# before_load_gcode:
# after_load_gcode:
# before_unload_gcode:
# after_unload_gcode:

# Behavior and persistence
auto_load_on_insert: True
clear_on_remove: True
check_on_print_start: True
override_load_unload: True
happy_hare_compat: True
state_file: ~/printer_data/config/.prusa_kload_state.json

# Example material override & custom material:
# [prusa_kload_material PLA]
# load_temp: 210
# unload_temp: 210
# aliases: PLA+, PLA-CF, SILK PLA, MATTE PLA
#
# [prusa_kload_material CF-PA]
# load_temp: 285
# unload_temp: 285
# purge_distance: 40
# aliases: PAHT-CF, PA-CF

# Optional Moonraker update_manager entry (add to moonraker.conf):
# [update_manager prusa_kload]
# type: git_repo
# path: ~/PrusaKLoad
# origin: https://github.com/weegeeday/PrusaKLoad.git
# primary_branch: main
# managed_services: klipper
# install_script: install.sh

