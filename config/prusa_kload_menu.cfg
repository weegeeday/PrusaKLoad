# PrusaKLoad Physical LCD Menu Configuration
# Include from printer.cfg when using a Klipper [display]:
#   [include prusa_kload_menu.cfg]

[menu __main __prusa_kload]
type: list
name: PrusaKLoad
enable: {'prusa_kload' in printer}

[menu __main __prusa_kload __loaded]
type: command
name: {"Loaded: " ~ (printer.prusa_kload.loaded_filament or "None")}
gcode:
    PRUSA_KLOAD_STATUS

# --- Context-Sensitive: Purge Confirmation ---
[menu __main __prusa_kload __confirm_purge]
type: list
name: Color Clear?
enable: {printer.prusa_kload.state == 'CONFIRM_PURGE'}

[menu __main __prusa_kload __confirm_purge __yes]
type: command
name: Yes (Color Clear)
gcode:
    PRUSA_KLOAD_CONFIRM_PURGE ACTION=YES

[menu __main __prusa_kload __confirm_purge __purge_more]
type: command
name: Purge More
gcode:
    PRUSA_KLOAD_CONFIRM_PURGE ACTION=PURGE_MORE

[menu __main __prusa_kload __confirm_purge __retry]
type: command
name: Retry Load
gcode:
    PRUSA_KLOAD_CONFIRM_PURGE ACTION=RETRY

[menu __main __prusa_kload __confirm_purge __cancel]
type: command
name: Cancel
gcode:
    PRUSA_KLOAD_CANCEL

# --- Context-Sensitive: Material Mismatch Warning ---
[menu __main __prusa_kload __mismatch]
type: list
name: Material Mismatch!
enable: {printer.prusa_kload.state == 'MISMATCH_PROMPT'}

[menu __main __prusa_kload __mismatch __swap]
type: command
name: {"Swap -> " ~ (printer.prusa_kload.requested_filament or "New")}
gcode:
    PRUSA_KLOAD_MISMATCH_ACTION ACTION=SWAP

[menu __main __prusa_kload __mismatch __force]
type: command
name: Force Continue
gcode:
    PRUSA_KLOAD_MISMATCH_ACTION ACTION=FORCE

[menu __main __prusa_kload __mismatch __cancel]
type: command
name: Cancel Print
gcode:
    PRUSA_KLOAD_MISMATCH_ACTION ACTION=CANCEL

# --- Context-Sensitive: Material Picker Prompt ---
[menu __main __prusa_kload __pick_material]
type: list
name: Pick Material
enable: {printer.prusa_kload.state == 'SELECT_MATERIAL'}

[menu __main __prusa_kload __pick_material __pla]
type: command
name: PLA
gcode: PRUSA_KLOAD_LOAD MATERIAL=PLA

[menu __main __prusa_kload __pick_material __petg]
type: command
name: PETG
gcode: PRUSA_KLOAD_LOAD MATERIAL=PETG

[menu __main __prusa_kload __pick_material __asa]
