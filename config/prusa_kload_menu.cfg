name: ABS
gcode: PRUSA_KLOAD_LOAD MATERIAL=ABS

[menu __main __prusa_kload __pick_material __pc]
type: command
name: PC
gcode: PRUSA_KLOAD_LOAD MATERIAL=PC

[menu __main __prusa_kload __pick_material __tpu]
type: command
name: TPU
gcode: PRUSA_KLOAD_LOAD MATERIAL=TPU

[menu __main __prusa_kload __pick_material __pa]
type: command
name: PA (Nylon)
gcode: PRUSA_KLOAD_LOAD MATERIAL=PA

[menu __main __prusa_kload __pick_material __hips]
type: command
name: HIPS
gcode: PRUSA_KLOAD_LOAD MATERIAL=HIPS

[menu __main __prusa_kload __pick_material __pvb]
type: command
name: PVB
gcode: PRUSA_KLOAD_LOAD MATERIAL=PVB

[menu __main __prusa_kload __pick_material __flex]
type: command
name: FLEX
gcode: PRUSA_KLOAD_LOAD MATERIAL=FLEX

[menu __main __prusa_kload __pick_material __cancel]
type: command
name: Cancel
gcode: PRUSA_KLOAD_CANCEL

